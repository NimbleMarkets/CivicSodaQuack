name: ci

env:
  GOLANGCI_LINT_VERSION: v2.14.0

# Branch pushes get the cheap checks (test job) without needing a PR; the lint
# job runs on PRs and main only. Docs-only pushes are skipped.
on:
  push:
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:

# One live run per branch: a push and the PR for the same branch share a group
# (head_ref for PRs, ref_name for pushes), and a newer commit cancels the older run.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # chat/ needs Go 1.27 (Fantasy's floor); the root module's 1.26
          # directive is a minimum, so one toolchain serves both.
          go-version-file: chat/go.mod

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::Files need gofmt:"
            echo "$out"
            exit 1
          fi

      - run: go vet ./...

      - run: go build ./...

      - run: go test -race ./...

      - name: chat module
        run: |
          go -C chat vet ./...
          go -C chat build ./...
          go -C chat test -race ./...

  lint:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Same toolchain as the test job: chat/ needs Go 1.27. Requires
          # golangci-lint >= v2.14 (v2.10 cannot read Go 1.27's stdlib).
          go-version-file: chat/go.mod

      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

      - name: golangci-lint (chat module)
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: chat
          args: --config ../.golangci.yml
