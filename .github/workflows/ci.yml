name: ci

env:
  GOLANGCI_LINT_VERSION: v2.10.1

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # chat/ needs Go 1.27 (Fantasy's floor); the root module's 1.26
          # directive is a minimum, so one toolchain serves both.
          go-version-file: chat/go.mod

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::Files need gofmt:"
            echo "$out"
            exit 1
          fi

      - run: go vet ./...

      - run: go build ./...

      - run: go test -race ./...

      - name: chat module
        run: |
          go -C chat vet ./...
          go -C chat build ./...
          go -C chat test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
