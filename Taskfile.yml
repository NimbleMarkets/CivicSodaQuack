version: '3'

tasks:
  default:
    desc: 'Default task is to "build"'
    deps:
      - build

  list:
    desc: 'Lists available tasks'
    cmds:
      - task --list-all

  tidy:
    desc: 'Tidy go modules'
    run: once
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
      - chat/go.mod
    cmds:
      - go mod tidy
      - go -C chat mod tidy

  build:
    desc: 'Build the csq CLI'
    deps: [tidy]
    vars:
      GIT_VERSION:
        sh: git describe --tags --always --dirty 2>/dev/null || echo 0.6.0-dev
    cmds:
      - >
        go build
        -ldflags "-X github.com/neomantra/CivicSodaQuack/internal/version.Version={{.GIT_VERSION}}"
        -o csq ./cmd/csq
    generates:
      - csq
    sources:
      - "**/*.go"
      - go.mod
      - go.sum

  vet:
    desc: 'Run go vet'
    cmds:
      - go vet ./...
      - go -C chat vet ./...

  test:
    desc: 'Run tests'
    deps: [vet]
    cmds:
      - go test ./...
      - go -C chat test ./...

  build-chat:
    desc: 'Build the csq-chat binary (nested module in chat/)'
    cmds:
      - go -C chat build -o ../bin/csq-chat ./cmd/csq-chat
    generates:
      - bin/csq-chat
    sources:
      - "chat/**/*.go"
      - chat/go.mod
      - chat/go.sum
      - "internal/**/*.go"

  clean:
    desc: 'Remove built artifacts'
    cmds:
      - rm -f csq
      - rm -rf bin dist
